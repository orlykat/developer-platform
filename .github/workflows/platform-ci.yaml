name: Platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements*.txt

      - name: Install dependencies
        run: pip install -r tools/requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

  helm-validation:
    name: Helm validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Validate application configurations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(apps/*/values.yaml)

          if (( ${#files[@]} == 0 )); then
            echo "No application configurations found"
            exit 1
          fi

          for values in "${files[@]}"; do
            app=$(basename "$(dirname "$values")")

            echo "::group::Validating $app"

            helm lint platform/helm/app-template \
              --strict \
              -f "$values"

            helm template "$app" platform/helm/app-template \
              --namespace "$app" \
              -f "$values" > /dev/null

            echo "::endgroup::"
          done