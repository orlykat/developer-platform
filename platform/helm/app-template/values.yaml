replicaCount: 1

image:
  repository: nginx
  tag: "1.28-alpine"
  pullPolicy: IfNotPresent

containerPort: 80

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

probes:
  readiness:
    enabled: true
    path: /
  liveness:
    enabled: true
    path: /