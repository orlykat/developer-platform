apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/orlykat/developer-platform.git
    targetRevision: main
    path: platform/helm/app-template
    helm:
      valueFiles:
        - ../../../apps/demo/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true