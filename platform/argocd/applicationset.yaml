apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: developer-apps
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/orlykat/developer-platform.git
        revision: main
        directories:
          - path: apps/*

  template:
    metadata:
      name: '{{ .path.basename }}'

    spec:
      project: default

      source:
        repoURL: https://github.com/orlykat/developer-platform.git
        targetRevision: main
        path: platform/helm/app-template
        helm:
          valueFiles:
            - '../../../{{ .path.path }}/values.yaml'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true